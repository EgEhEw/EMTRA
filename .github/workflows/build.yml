name: Build EMTRA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew build_all.sh

      - name: Build all mod variants
        run: |
          mkdir -p build/release
          echo "Building Fabric 1.20.1..."
          ./gradlew :fabric:build -Pminecraft_version=1.20.1
          cp fabric/build/libs/EMTRA-fabric-*.jar build/release/

          echo "Building Fabric 1.20.4..."
          ./gradlew :fabric:build -Pminecraft_version=1.20.4
          cp fabric/build/libs/EMTRA-fabric-*.jar build/release/

          echo "Building Forge 1.20.1..."
          ./gradlew :forge:build -Pminecraft_version=1.20.1 -Dnet.minecraftforge.gradle.check.certs=false
          cp forge/build/libs/EMTRA-forge-*.jar build/release/

          echo "Building Forge 1.20.4..."
          ./gradlew :forge:build -Pminecraft_version=1.20.4 -Dnet.minecraftforge.gradle.check.certs=false
          cp forge/build/libs/EMTRA-forge-*.jar build/release/

          echo "Generated Jars:"
          ls -lh build/release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EMTRA-builds
          path: build/release/*.jar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.jar
          name: EMTRA ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
