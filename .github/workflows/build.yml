name: Build EMTRA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Delete sources jars from existing releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scanning releases for unwanted sources jars..."
          RELEASES=$(gh release list --repo ${{ github.repository }} --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $RELEASES; do
            echo "Checking release $tag..."
            ASSETS=$(gh release view "$tag" --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name | endswith("-sources.jar")) | .name' 2>/dev/null || true)
            for asset in $ASSETS; do
              echo "Deleting $asset from release $tag..."
              gh release delete-asset "$tag" "$asset" --repo ${{ github.repository }} --yes || true
            done
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew build_all.sh

      - name: Build all mod variants
        run: |
          mkdir -p build/release
          echo "Building Fabric 1.20.1..."
          ./gradlew :fabric:build -Pminecraft_version=1.20.1
          cp fabric/build/libs/EMTRA-fabric-*.jar build/release/

          echo "Building Fabric 1.20.4..."
          ./gradlew :fabric:build -Pminecraft_version=1.20.4
          cp fabric/build/libs/EMTRA-fabric-*.jar build/release/

          echo "Building Forge 1.20.1..."
          ./gradlew :forge:build -Pminecraft_version=1.20.1 -Dnet.minecraftforge.gradle.check.certs=false
          cp forge/build/libs/EMTRA-forge-*.jar build/release/

          echo "Building Forge 1.20.4..."
          ./gradlew :forge:build -Pminecraft_version=1.20.4 -Dnet.minecraftforge.gradle.check.certs=false
          cp forge/build/libs/EMTRA-forge-*.jar build/release/

          # Exclude all -sources.jar files from release artifacts
          rm -f build/release/*-sources.jar

          echo "Generated Jars:"
          ls -lh build/release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EMTRA-builds
          path: build/release/*.jar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.jar
          name: EMTRA ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Verify and remove any sources jars from release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Verifying release $TAG assets..."
          ASSETS=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name | endswith("-sources.jar")) | .name' 2>/dev/null || true)
          for asset in $ASSETS; do
            echo "Deleting unwanted asset: $asset from release $TAG..."
            gh release delete-asset "$TAG" "$asset" --repo ${{ github.repository }} --yes || true
          done
